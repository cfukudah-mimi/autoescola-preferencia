<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas Aulas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#172033}
header{background:#0b132b;color:#fff;padding:16px 18px}
.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
main{max-width:1180px;margin:20px auto;padding:0 15px}
.panel,.card{background:#fff;border-radius:15px;padding:18px;box-shadow:0 3px 14px #00000010;margin-bottom:15px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card b{display:block;font-size:29px;margin-top:6px}
h1,h2,h3{margin-top:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
button,.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#0b132b;color:#fff}.green{background:#25D366;color:#fff}.orange{background:#ff7a00;color:#fff}
.danger{background:#ffe8e8;color:#b42318}.light{background:#eef2f6;color:#172033}
input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}
label{font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
th{color:#667085;font-size:12px}
.badge{display:inline-block;padding:5px 8px;border-radius:18px;font-size:12px;font-weight:700}
.pendente{background:#fff3cd;color:#7a5b00}.confirmada{background:#dff5e7;color:#15723a}.realizada{background:#e5eeff;color:#1c4f9c}.cancelada,.falta{background:#ffe7e7;color:#a51d1d}
.muted{color:#667085}.hidden{display:none}.notice{padding:12px;border-radius:10px;margin:12px 0;background:#eef5ff}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}table{display:block;overflow:auto}}
</style></head>
<body><header><div class="top"><strong>📚 Área do Aluno</strong><a class="btn light" href="index.html">Voltar</a></div></header>
<main>
<div id="loginAluno" class="panel" style="max-width:480px;margin:20px auto">
<h2>🔐 Entrar em Minhas Aulas</h2><p class="muted">Use o WhatsApp cadastrado na autoescola e sua senha de acesso.</p>
<label>WhatsApp<input id="tel" placeholder="Mesmo número cadastrado"></label><br><br>
<label>Senha<input id="senhaAluno" type="password" placeholder="Sua senha"></label><br><br>
<button class="primary" onclick="entrarAluno()">Entrar</button><div id="msgLogin" style="margin-top:10px"></div><p id="erroAluno" style="color:#b42318"></p>
</div>
<div id="areaAluno" class="hidden">
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin-bottom:4px">Olá, <span id="nomeAluno"></span></h2><span class="muted">Seus agendamentos e histórico</span></div><button class="light" onclick="sairAluno()">Sair</button></div></div>
<div class="panel" id="resultado"></div>
</div></main>

<script>
const SUPABASE_URL = 'https://tstxaoxhgdrtdxrnxqiz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MsvCYm5hhlJkavmyF-hfyA_i5W48a_P';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s='') => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizarTelefone(v){ return String(v||'').replace(/\D/g,''); }

async function entrarAluno(){
  const tel = normalizarTelefone($('tel')?.value);
  const senha = $('senhaAluno')?.value || '';
  const msg = $('msgLogin');

  if(msg) msg.innerHTML = '';
  if(!tel || !senha){
    if(msg) msg.innerHTML = '<div class="warn">Informe WhatsApp e senha.</div>';
    return;
  }

  const {data: aluno, error} = await sb
    .from('alunos')
    .select('id,nome,telefone,categoria,status')
    .eq('telefone', tel)
    .eq('senha', senha)
    .maybeSingle();

  if(error){
    if(msg) msg.innerHTML = '<div class="warn">Erro ao validar acesso: '+esc(error.message)+'</div>';
    return;
  }
  if(!aluno){
    if(msg) msg.innerHTML = '<div class="warn">WhatsApp ou senha inválidos.</div>';
    return;
  }
  if(aluno.status !== 'Ativo'){
    if(msg) msg.innerHTML = '<div class="warn">Seu acesso não está ativo. Procure a autoescola.</div>';
    return;
  }

  sessionStorage.setItem('aluno_online_id', aluno.id);
  $('loginAluno')?.classList.add('hidden');
  $('areaAluno')?.classList.remove('hidden');
  if($('nomeAluno')) $('nomeAluno').textContent = aluno.nome;
  await carregarAulas(aluno);
}

async function carregarAulas(aluno){
  const box = $('aulasBox');
  if(!box) return;
  box.innerHTML = '<p class="muted">Carregando suas aulas...</p>';

  const {data, error} = await sb
    .from('agendamentos')
    .select('id,data,horario,tipo,status,instrutores(nome),veiculos(modelo)')
    .eq('aluno_id', aluno.id)
    .order('data', {ascending:true})
    .order('horario', {ascending:true});

  if(error){
    box.innerHTML = '<div class="warn">Erro ao carregar aulas: '+esc(error.message)+'</div>';
    return;
  }

  if(!data || data.length===0){
    box.innerHTML = '<p class="muted">Você ainda não possui aulas agendadas.</p>';
    return;
  }

  box.innerHTML = `<table>
    <tr><th>Data</th><th>Horário</th><th>Tipo</th><th>Instrutor</th><th>Veículo</th><th>Status</th></tr>
    ${data.map(a=>`<tr>
      <td>${esc(a.data)}</td>
      <td>${esc(String(a.horario).slice(0,5))}</td>
      <td>${esc(a.tipo||'')}</td>
      <td>${esc(a.instrutores?.nome||'')}</td>
      <td>${esc(a.veiculos?.modelo||'')}</td>
      <td><span class="badge ${String(a.status||'').toLowerCase()}">${esc(a.status||'')}</span></td>
    </tr>`).join('')}
  </table>`;
}

function sairAluno(){
  sessionStorage.removeItem('aluno_online_id');
  $('areaAluno')?.classList.add('hidden');
  $('loginAluno')?.classList.remove('hidden');
  if($('senhaAluno')) $('senhaAluno').value='';
}

(async()=>{
  const id = sessionStorage.getItem('aluno_online_id');
  if(!id) return;
  const {data: aluno} = await sb
    .from('alunos')
    .select('id,nome,telefone,categoria,status')
    .eq('id',id)
    .maybeSingle();

  if(aluno && aluno.status==='Ativo'){
    $('loginAluno')?.classList.add('hidden');
    $('areaAluno')?.classList.remove('hidden');
    if($('nomeAluno')) $('nomeAluno').textContent = aluno.nome;
    await carregarAulas(aluno);
  }
})();
</script>
</body></html>
