<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agendamento Online - Autoescola Preferência</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#172033}
header{background:#0b132b;color:#fff;padding:16px}
.top{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
main{max-width:760px;margin:22px auto;padding:0 15px}
.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 14px #0001;margin-bottom:16px}
h1,h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;margin-top:6px;background:#fff}
button,.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#0b132b;color:#fff} .green{background:#25D366;color:#fff} .light{background:#eef2f6;color:#172033}
.notice{padding:14px;border-radius:11px;background:#eef5ff;margin:10px 0}
.ok{padding:14px;border-radius:11px;background:#e8f7ed;color:#147a35}
.warn{padding:14px;border-radius:11px;background:#fff4e5;color:#8a4b00}
.muted{color:#667085} .hidden{display:none}
.option{border:1px solid #e4e7ec;border-radius:12px;padding:14px;margin:10px 0}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="top"><strong>🚗 Autoescola Preferência</strong><a href="index.html" class="btn light">Voltar</a></div></header>

<main>
<div class="panel">
<h1>📅 Agendamento Online</h1>
<p class="muted">Informe seus dados e o sistema buscará horários disponíveis no banco online da autoescola.</p>

<div class="grid">
<label>Nome completo<input id="nome" placeholder="Seu nome"></label>
<label>WhatsApp<input id="telefone" placeholder="(00) 00000-0000"></label>

<label>Categoria
<select id="categoria">
<option>B</option>
<option>A</option>
<option>AB</option>
</select>
</label>

<label>Tipo de aula
<select id="tipo">
<option>Aula prática</option>
<option>Reposição</option>
<option>Preparação para exame</option>
</select>
</label>

<label>Data<input id="data" type="date"></label>

<label>Período
<select id="periodo">
<option value="todos">Qualquer horário</option>
<option value="manha">Manhã</option>
<option value="tarde">Tarde</option>
</select>
</label>

<button class="primary full" onclick="buscarHorarios()">🔎 Encontrar horários</button>
</div>
</div>

<div class="panel">
<h2>⭐ Horários disponíveis</h2>
<div id="opcoes" class="muted">Preencha os dados e clique em “Encontrar horários”.</div>
</div>

<div id="resultado" class="panel hidden"></div>
</main>

<script>
const SUPABASE_URL = "https://tstxaoxhgdrtdxrnxqiz.supabase.co";
const SUPABASE_KEY = "sb_publishable_MsvCYm5hhlJkavmyF-hfyA_i5W48a_P";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let opcoesAtuais = [];

const hoje = new Date();
hoje.setMinutes(hoje.getMinutes() - hoje.getTimezoneOffset());
data.min = hoje.toISOString().slice(0,10);
data.value = data.min;

function esc(v='') {
  return String(v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function brDate(iso='') {
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function validar() {
  if(!nome.value.trim() || !telefone.value.trim() || !data.value) {
    opcoes.innerHTML = '<div class="warn">Informe nome, WhatsApp e data.</div>';
    return false;
  }
  return true;
}

async function buscarHorarios() {
  if(!validar()) return;

  opcoes.innerHTML = '<p class="muted">Consultando disponibilidade...</p>';

  const {data:lista, error} = await sb.rpc('opcoes_agendamento', {
    p_categoria: categoria.value,
    p_data: data.value,
    p_periodo: periodo.value,
    p_telefone: telefone.value.trim()
  });

  if(error) {
    opcoes.innerHTML = `<div class="warn">Erro ao consultar horários: ${esc(error.message)}</div>`;
    return;
  }

  opcoesAtuais = lista || [];

  if(!opcoesAtuais.length) {
    opcoes.innerHTML = '<div class="warn">Nenhum horário disponível para essa data/período. Tente outra opção.</div>';
    return;
  }

  opcoes.innerHTML = opcoesAtuais.map((o,i)=>`
    <div class="option">
      <b>${i===0 ? '🥇 Melhor opção' : 'Opção '+(i+1)}</b><br><br>
      📅 ${brDate(data.value)} às <b>${String(o.horario).slice(0,5)}</b><br>
      👨‍🏫 ${esc(o.instrutor_nome)}<br>
      🚗 ${esc(o.veiculo_nome)}<br><br>
      <button class="green" onclick="solicitar(${i})">Solicitar este horário</button>
    </div>
  `).join('');
}

async function solicitar(i) {
  const o = opcoesAtuais[i];
  if(!o) return;

  const botao = event?.target;
  if(botao) {
    botao.disabled = true;
    botao.textContent = 'Enviando...';
  }

  const {data:idAgendamento, error} = await sb.rpc('solicitar_agendamento', {
    p_nome: nome.value.trim(),
    p_telefone: telefone.value.trim(),
    p_categoria: categoria.value,
    p_tipo: tipo.value,
    p_data: data.value,
    p_horario: o.horario,
    p_instrutor_id: o.instrutor_id,
    p_veiculo_id: o.veiculo_id
  });

  if(error) {
    resultado.classList.remove('hidden');
    resultado.innerHTML = `<div class="warn"><b>Não foi possível concluir.</b><br>${esc(error.message)}</div>`;
    if(botao) {
      botao.disabled = false;
      botao.textContent = 'Solicitar este horário';
    }
    return;
  }

  resultado.classList.remove('hidden');
  resultado.innerHTML = `
    <div class="ok">
      <h2>🟡 Solicitação registrada!</h2>
      <p><b>${esc(nome.value.trim())}</b>, sua solicitação foi enviada para a autoescola.</p>
      <p>📅 ${brDate(data.value)} às <b>${String(o.horario).slice(0,5)}</b><br>
      👨‍🏫 ${esc(o.instrutor_nome)}<br>
      🚗 ${esc(o.veiculo_nome)}</p>
      <p>Se a autoescola estiver no modo de aprovação manual, o agendamento aparecerá como <b>Pendente</b> até ser aprovado.</p>
    </div>
  `;
  opcoes.innerHTML = '<p class="muted">Solicitação enviada. Aguarde a confirmação da autoescola.</p>';
}
</script>
</body></html>
