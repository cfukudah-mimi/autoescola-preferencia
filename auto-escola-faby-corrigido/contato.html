<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Autoescola Preferência</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-container">
    
    <header>
      <h1>Fale Conosco</h1>
      <p>Preencha os campos abaixo para nos enviar um e-mail ✉️</p>
    </header>

    <main>
      <form action="mailto:autoescolapreferencia.social@gmail.com" method="post" enctype="text/plain">
        <label>Nome:<br><input type="text" name="name" required></label><br><br>
        <label>Email:<br><input type="email" name="email" required></label><br><br>
        <label>Mensagem:<br><textarea name="message" rows="5" required></textarea></label><br><br>
        <button type="submit" class="btn-link btn-aula" style="width: 100%; border: none; cursor: pointer;">Enviar Email</button>
      </form>
    </main>

    <br>
    <!-- Botão para voltar à página inicial -->
    <a href="index.html" class="btn-link btn-aluno">⬅️ Voltar ao Início</a>

    <p class="copyright">© 2026 Autoescola Preferência</p>

  </div>

</body>
</html>
